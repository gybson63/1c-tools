repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix, --config=tools/cfe-from-diff/pyproject.toml]
        files: ^tools/cfe-from-diff/
      - id: ruff-format
        args: [--config=tools/cfe-from-diff/pyproject.toml]
        files: ^tools/cfe-from-diff/

  - repo: local
    hooks:
      - id: mypy-cfe-from-diff
        name: mypy (cfe-from-diff)
        language: system
        entry: python scripts/run_mypy_cfe.py
        pass_filenames: false
        always_run: true
        files: ^tools/cfe-from-diff/

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.3.7
    hooks:
      - id: pylint
        additional_dependencies:
          - lxml>=4.9
          - pytest>=7.0
        args:
          - --rcfile=tools/cfe-from-diff/pyproject.toml
          - tools/cfe-from-diff/src
          - tools/cfe-from-diff/tests
        pass_filenames: false
        always_run: true
